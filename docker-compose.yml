services:
  app:
    build: .
    container_name: gudangcerdas-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gudang_cerdas
      DB_USERNAME: gudang_user
      DB_PASSWORD: ${DB_PASSWORD:-gudang_local_only}
      SESSION_DRIVER: file
      SESSION_ENCRYPT: "true"
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage

  db:
    image: mysql:8.4
    container_name: gudangcerdas-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gudang_cerdas
      MYSQL_USER: gudang_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-gudang_local_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_only}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_local_only}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  app_storage:
